<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>ReviewSend</title>
<style>
  body { font: 14px/1.6 "Noto Sans TC", "Microsoft JhengHei", Roboto, Arial, sans-serif; max-width: 980px; margin: 32px auto; padding: 0 20px 48px; color: #1f1f1f; }
  h1 { font-size: 22px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .lang { font-size: 13px; color: #444; white-space: nowrap; }
  .lang select { font: inherit; padding: 3px 6px; margin-left: 6px; }
  .intro { color: #444; }
  #setup { background: #fef7e0; color: #7a4f01; border-radius: 10px; padding: 12px 14px; margin-top: 12px; }

  /* 每個設定一個區塊：左邊填寫，右邊說明 */
  .block { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start;
    border: 1px solid #dadce0; border-radius: 12px; padding: 16px 18px; margin-top: 16px; }
  .block.focus { border-color: #0b57d0; box-shadow: 0 0 0 2px #d3e3fd; }
  .block h2 { font-size: 15px; margin: 0 0 8px; }
  .block h2 .step { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center;
    border-radius: 50%; background: #0b57d0; color: #fff; font-size: 12px; margin-right: 6px; }
  .help { background: #f6f8fc; border-radius: 10px; padding: 10px 12px; color: #444; font-size: 13px; }
  .help b { color: #1f1f1f; }
  .help ul { margin: 4px 0 0; padding-left: 18px; }
  .help code { background: #e8eaed; border-radius: 4px; padding: 0 4px; font-family: Consolas, monospace; }
  @media (max-width: 760px) { .block { grid-template-columns: 1fr; } }

  input[type=number] { width: 80px; font: inherit; }
  textarea { width: 100%; height: 96px; box-sizing: border-box; font-family: Consolas, monospace; font-size: 13px; }
  input[type=text] { width: 100%; box-sizing: border-box; font: inherit; font-family: Consolas, monospace; padding: 6px 8px; }
  .chk { display: block; }

  .managed { background: #e8f0fe; color: #174ea6; border-radius: 8px; padding: 6px 10px; margin-bottom: 6px; font-size: 13px; word-break: break-all; }
  .lock { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #e8f0fe; color: #174ea6; white-space: nowrap; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .tag.ext { background: #fce8e6; color: #c5221f; }
  .tag.grp { background: #fef7e0; color: #b06000; }
  .tag.alert { background: #c5221f; color: #fff; }
  .tag.ok { background: #e6f4ea; color: #137333; }

  /* 即時預覽 */
  .live { margin-top: 8px; font-size: 13px; color: #444; min-height: 22px; }
  .bar { height: 4px; background: #e8eaed; border-radius: 2px; overflow: hidden; margin: 8px 0 4px; }
  .bar i { display: block; height: 100%; width: 100%; background: #0b57d0; }
  #tryResult { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: #f6f8fc; min-height: 24px; }
  #tryResult .em { font-family: Consolas, monospace; margin-right: 8px; }
  .warn { color: #a50e0e; }

  .actions { margin-top: 24px; }
  button { padding: 8px 22px; border-radius: 999px; border: 0; background: #0b57d0; color: #fff; font: inherit; cursor: pointer; }
  button.ghost { background: #fff; color: #0b57d0; border: 1px solid #747775; padding: 4px 14px; }
  .actions button.ghost { padding: 7px 18px; margin-left: 8px; }
  #status { margin-left: 12px; color: #188038; }
</style>
</head>
<body>
  <div class="top">
    <h1 data-i18n="optTitle">ReviewSend</h1>
    <label class="lang">語言 / Language
      <select id="language">
        <option value="auto" data-i18n="optLangAuto">Auto</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
      </select>
    </label>
  </div>
  <p class="intro" data-i18n="optIntro"></p>

  <div id="setup" data-i18n="optSetup" hidden></div>

  <section class="block" data-block>
    <div>
      <h2><span class="step">1</span><span data-i18n="optH1"></span></h2>
      <div class="managed" id="m-internalDomains" hidden></div>
      <textarea id="internalDomains" placeholder="example.com"></textarea>
      <div class="live" id="domainLive"></div>
    </div>
    <aside class="help" data-i18n-html="optHelp1"></aside>
  </section>

  <section class="block" data-block>
    <div>
      <h2><span class="step">2</span><span data-i18n="optH2"></span></h2>
      <input type="number" id="countdown" min="1" max="120"> <span data-i18n="optSeconds"></span> <span class="lock" id="l-countdown" data-i18n="optLocked" hidden></span>
      <div class="bar"><i id="countBar"></i></div>
      <div class="live" id="countLive"></div>
      <button type="button" class="ghost" id="countPlay" data-i18n="optPlay"></button>
    </div>
    <aside class="help" data-i18n-html="optHelp2"></aside>
  </section>

  <section class="block" data-block>
    <div>
      <h2><span class="step">3</span><span data-i18n="optH3"></span></h2>
      <div class="managed" id="m-groupPatterns" hidden></div>
      <textarea id="groupPatterns"></textarea>
    </div>
    <aside class="help" data-i18n-html="optHelp3"></aside>
  </section>

  <section class="block" data-block>
    <div>
      <h2><span class="step">4</span><span data-i18n="optH4"></span></h2>
      <div class="managed" id="m-alertPatterns" hidden></div>
      <textarea id="alertPatterns" placeholder="boss@example.com&#10;@competitor.com"></textarea>
    </div>
    <aside class="help" data-i18n-html="optHelp4"></aside>
  </section>

  <section class="block" data-block>
    <div>
      <h2><span class="step">5</span><span data-i18n="optH5"></span></h2>
      <label class="chk"><input type="checkbox" id="holdOnWarning"> <span data-i18n="optHold"></span> <span class="lock" id="l-holdOnWarning" data-i18n="optLocked" hidden></span></label>
      <label class="chk"><input type="checkbox" id="enabled"> <span data-i18n="optEnabled"></span> <span class="lock" id="l-enabled" data-i18n="optLocked" hidden></span></label>
    </div>
    <aside class="help" data-i18n-html="optHelp5"></aside>
  </section>

  <section class="block" data-block>
    <div>
      <h2><span class="step" data-i18n="optStepTry"></span><span data-i18n="optHTry"></span></h2>
      <input type="text" id="tryEmail" data-i18n-placeholder="optTryPlaceholder">
      <div id="tryResult"></div>
    </div>
    <aside class="help" data-i18n-html="optHelpTry"></aside>
  </section>

  <div class="actions">
    <button id="save" data-i18n="optSave"></button>
    <button type="button" class="ghost" id="exportBtn" data-i18n="optExport"></button>
    <button type="button" class="ghost" id="importBtn" data-i18n="optImport"></button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <span id="status"></span>
  </div>
  <p class="intro" style="font-size:13px" data-i18n="optNote1"></p>
  <p class="intro" style="font-size:13px" data-i18n="optNote2"></p>

  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
